<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Bat Family</title>
    <style>
    /* Khung chứa lớn */
    #root {
        max-width: 1024px;
        margin: 0 auto;
        text-align: center;
    }

    /* Phần tiêu đề */
    #site-header {
        margin: 30px 0;
        padding: 15px;
        background-color: #cccccc;
        color: white;
        text-shadow: 2px 2px 2px black;
    }

    /* Logo con dơi đặt trước chữ */
    #site-header span {
        background-image: url("css2/imgs/logo.png");
        background-repeat: no-repeat;
        background-position: left center;
        background-size: 60px auto;
        padding-left: 70px;
    }

    /* Danh sách nhân vật */
    .superheroes {
        list-style-type: none;
        padding: 0;
    }

    /* Mỗi nhân vật là một mục nằm ngang */
    .superheroes li {
        display: inline-block;
        position: relative;
        width: 17%;
        vertical-align: middle;
    }

    /* Hình nhân vật */
    .superheroes img {
        width: 100%;
        max-width: 100%;
        border-radius: 15px;
    }

    /* Tên nằm phía trên hình */
    .hero-header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 10px 0;
        color: white;
        background-color: rgba(0, 0, 0, 0.3);
        border-radius: 15px 15px 0 0;
    }

    /* Ẩn liên kết khi chưa đưa chuột vào */
    .superheroes a {
        display: none;
        padding: 10px 0;
        background-color: #666666;
        color: white;
        text-decoration: none;
    }

    /* Đưa chuột vào: hình nhân vật lớn hơn */
    .superheroes li:hover {
        width: 20%;
    }

    /* Đưa chuột vào: hiện liên kết và gạch chân */
    .superheroes li:hover a {
        display: block;
        text-decoration: underline;
    }
</style>
</head>
<body>
    <div id="root">
        <h1 id="site-header"><span>The Bat family</span></h1>
        <ul class="superheroes">
            <li>
                <strong class="hero-header">Batman</strong>
                <img src="css2/imgs/superhero-1.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Batman">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batwing</strong>
                <img src="css2/imgs/superhero-2.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Batwing_(DC_Comics)">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Batgirl</strong>
                <img src="css2/imgs/superhero-3.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Batgirl">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Nightwing</strong>
                <img src="css2/imgs/superhero-4.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Nightwing">Read more</a>
            </li>
            <li>
                <strong class="hero-header">Red Robin</strong>
                <img src="css2/imgs/superhero-5.jpg" alt="">
                <a href="https://en.wikipedia.org/wiki/Red_Robin_(comics)">Read more</a>
            </li>
        </ul>
    </div>
</body>
</html>

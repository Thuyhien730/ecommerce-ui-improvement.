<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 9 - Font Awesome</title>

    <!-- Kết nối thư viện Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #333333;
        }

        p {
            font-size: 20px;
        }

        /* Định dạng chung cho các biểu tượng */
        i {
            color: #0088cc;
            width: 35px;
        }
    </style>
</head>

<body>
    <h1>Một số biểu tượng Font Awesome</h1>

    <p>
    <i class="fa-solid fa-robot" aria-hidden="true"></i>
    Robot
</p>

<p>
    <i class="fa-solid fa-ghost" aria-hidden="true"></i>
    Con ma
</p>

<p>
    <i class="fa-solid fa-dragon" aria-hidden="true"></i>
    Con rồng
</p>

<p>
    <i class="fa-solid fa-user-astronaut" aria-hidden="true"></i>
    Phi hành gia
</p>

<p>
    <i class="fa-solid fa-rocket" aria-hidden="true"></i>
    Tên lửa
</p>

<p>
    <i class="fa-solid fa-meteor" aria-hidden="true"></i>
    Thiên thạch
</p>

<p>
    <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
    Đũa phép
</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Khoa CNTTKD</title>

    <style>
        /* Định dạng chung cho trang */
        body {
            font-family: Arial, sans-serif;
            color: #333333;
        }

        /* Canh giữa toàn bộ nội dung */
        .best-shared {
            text-align: center;
        }

        /* Tạo khoảng cách phía trên logo */
        .logo {
            margin-top: 30px;
        }

        /* Định dạng tiêu đề */
        .best-shared h2 {
            font-size: 45px;
            font-weight: normal;
            margin: 30px 0;
        }

        /* Tô màu cho chữ Shared Hosting */
        .best-shared h2 strong {
            color: #00aeef;
        }

        /* Định dạng đoạn giới thiệu */
        .lead-text {
            font-size: 16px;
            margin-bottom: 40px;
        }

        /* Bỏ dấu chấm và khoảng đệm của danh sách */
        .btn-list {
            list-style-type: none;
            padding: 0;
        }

        /* Đặt hai mục nằm ngang và tạo khoảng cách */
        .btn-list li {
            display: inline-block;
            margin: 0 10px;
        }

        /* Định dạng liên kết thành nút */
        .btn-list a {
            display: inline-block;
            width: 170px;
            padding: 18px 0;
            background-color: #2d3032;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <section class="best-shared">
        <!-- Logo -->
        <p class="logo">
            <img
                style="width: 200px"
                src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png"
                alt="Logo Khoa Công nghệ thông tin kinh doanh UEH"
            >
        </p>

        <!-- Tiêu đề -->
        <h2>Best <strong>Shared Hosting</strong> Company</h2>

        <!-- Đoạn giới thiệu -->
        <p class="lead-text">
            With this responsive landing page template, you can promote
            your all hosting, domain and email services.
        </p>

        <!-- Hai liên kết -->
        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>
    </section>
</body>
</html>

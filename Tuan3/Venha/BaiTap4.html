<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập 4 - CSS</title>

    <style>
        /* Bỏ dấu chấm và khoảng đệm mặc định của danh sách */
        ul {
            list-style-type: none;
            padding: 0;
        }

        /* Đặt các mục nằm trên cùng một hàng */
        li {
            display: inline-block;
        }

        /* Định dạng từng liên kết */
        a {
            display: inline-block;
            width: 150px;
            background-color: cyan;
            text-align: center;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <!-- Danh sách liên kết của bài 4 -->
    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>
</body>
</html>
